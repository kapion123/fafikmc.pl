<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FafikMC.pl</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("img/lobby.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
    }

    .server-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .server-info img {
      height: 50px;
      width: 50px;
      border-radius: 50%;
    }

    #players {
      font-weight: bold;
      color: #00ff80;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-left: 6px;
      background-color: gray;
    }

    /* === ŚRODEK STRONY === */
    main {
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-shadow: 0 0 15px black;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 30px;
      font-weight: 900;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    .buttons a {
      text-decoration: none;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 1.2rem;
      transition: background 0.3s, transform 0.2s;
    }

    .buttons a:hover {
      background: #00ff80;
      color: black;
      transform: scale(1.05);
    }

    /* === DOLNA SEKCJA === */
    footer {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      padding: 30px 0;
      text-align: center;
    }

    footer h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .modes {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .mode {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      overflow: hidden;
      width: 260px;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .mode:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px #00ff80;
    }

    .mode img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .mode-name {
      padding: 10px;
      font-size: 1.3rem;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <header>
    <div class="server-info">
      <img src="img/fafikmc1.png" alt="Logo">
      <span>Gracze online: <span id="players">?</span> <span class="status-dot" id="statusDot"></span></span>
    </div>
  </header>

  <main>
    <h1>FAFIKMC.PL</h1>
    <div class="buttons">
      <a href="https://discord.gg/TWÓJ_LINK" target="_blank">Discord</a>
      <a href="https://fafikmc.pl" target="_blank">Strona</a>
    </div>
  </main>

  <footer>
    <h2>Tryby</h2>
    <div class="modes">
      <div class="mode">
        <img src="img/boxpvp.png" alt="BoxPvP">
        <div class="mode-name">BoxPvP</div>
      </div>
      <div class="mode">
        <img src="img/anarchia.png" alt="Anarchia / FFA">
        <div class="mode-name">Anarchia / FFA</div>
      </div>
    </div>
  </footer>

  <script>
    const SERVER_IP = "fafikmc.pl";

    async function updatePlayers() {
      try {
        const response = await fetch(`https://api.mcsrvstat.us/2/${SERVER_IP}`);
        const data = await response.json();
        const players = document.getElementById("players");
        const dot = document.getElementById("statusDot");

        if (data.online) {
          players.textContent = data.players.online;
          dot.style.backgroundColor = "#00ff80"; // zielony - online
        } else {
          players.textContent = "Offline";
          dot.style.backgroundColor = "red";
        }
      } catch {
        document.getElementById("players").textContent = "Błąd";
        document.getElementById("statusDot").style.backgroundColor = "gray";
      }
    }

    updatePlayers();
    setInterval(updatePlayers, 30000);
  </script>
</body>
</html>
